name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      agent: >-
        {"models":[{"provider":"openai","names":["test-model"]}],"agents":{"snap_agent":{"model":"openai:test-model"}}}
      toolkits: >-
        {"tavily_key":"test","volcano_tts":{"app_id":"test","access_token":"test","voice_type":"test"}}

    steps:
      - name: Setup | Checkout Repository
        uses: actions/checkout@v6

      - name: Setup | Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup | uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Setup | Python Dependencies
        run: uv sync --dev --locked

      - name: Check | Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Check | Static Analysis
        run: uv run poe lint

      - name: Check | Backend Tests
        run: uv run poe test

      - name: Upload | Coverage Report
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

      - name: Setup | Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check | Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: snapbot:release-check
          cache-from: type=gha,scope=snapbot-release
          cache-to: type=gha,mode=max,scope=snapbot-release

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: checks
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write

    outputs:
      released: ${{ steps.release.outputs.released }}
      prerelease: ${{ steps.release.outputs.is_prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup | Reset Release Branch to Workflow SHA
        run: git reset --hard ${{ github.sha }}

      - name: Action | Semantic Version Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.2
        with:
          config_file: semantic.toml
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com

      - name: Publish | Upload GitHub Release Assets
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10.6.2
        with:
          config_file: semantic.toml
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    environment: release
    needs: release
    if: needs.release.outputs.released == 'true'
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Setup | Checkout Released Tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup | QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup | Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup | Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup | Docker Metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: tropicalalgae/snapbot
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest,enable=${{ needs.release.outputs.prerelease != 'true' }}

      - name: Publish | Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=snapbot-release
          cache-to: type=gha,mode=max,scope=snapbot-release
          provenance: mode=max
          sbom: true
